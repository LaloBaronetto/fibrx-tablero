name: Actualizar tasas FIBRX

on:
  # Se conserva el disparo semanal existente hasta validar la integración en producción.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Consultar ArgentinaDatos + Fonditos
        env:
          FONDITOS_API_KEY: ${{ secrets.FONDITOS_API_KEY }}
        run: python ingesta_tasas.py

      - name: Commit y Push de tasas verificadas
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tasas_mercado.json
          git diff --staged --quiet || git commit -m "Auto: actualización de benchmarks FCI FIBRX [skip ci]"
          git push
