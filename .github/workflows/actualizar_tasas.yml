name: Actualizar Tasas FCI FIBRX

on:
  schedule:
    - cron: '0 8 * * 1' # Lunes 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fibrx-actualizar-tasas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar sintaxis de ingesta
        run: python -m py_compile ingesta_tasas.py

      - name: Consultar y validar seis clases FCI y ON
        run: python ingesta_tasas.py

      - name: Validar JSON publicado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tasas_mercado.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          expected = {
              "BALZ_MM_PESOS_A", "BALZ_MM_PESOS_L", "BALZ_PERFORMANCE_XIII_D",
              "IOL_CASH_MGMT_B", "UALINTEC_AHORRO_A", "UALINTEC_PESOS_PLUS_A"
          }
          actual = {x.get("id") for x in d.get("vehiculos", [])}
          assert d.get("schema_version") == 6, "El JSON no es esquema 6"
          assert d.get("estado_global") == "DATOS_ARGENTINADATOS_UNA_FUENTE", "Estado global inesperado"
          assert actual == expected, f"Clases incorrectas: {sorted(actual)}"
          assert len(d["vehiculos"]) == 6, "Se requieren seis registros únicos"
          def tna_valida(x):
              try:
                  valor = float(x["tna"])
              except (KeyError, TypeError, ValueError):
                  return False
              return -5 <= valor <= 5 and valor != 0

          assert all(tna_valida(x) for x in d["vehiculos"]), "TNA fuera de rango, cero o inválida"
          print("OK: schema 6 y seis clases FCI validadas")
          PY

      - name: Publicar cambios de tasas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasas_mercado.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos en las tasas."
          else
            git commit -m "Auto: actualización validada de seis clases FCI [skip ci]"
            git push
          fi
